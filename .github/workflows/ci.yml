name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Proto stubs are up to date
        run: |
          python -m grpc_tools.protoc -I. --python_out=. --pyi_out=. --grpc_python_out=. driftline/serving/proto/predict.proto
          git diff --exit-code driftline/serving/proto
      - name: Tests
        run: pytest -q

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render kustomize
        run: kubectl kustomize deploy/k8s > rendered.yaml
      - name: Validate against k8s schemas
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary rendered.yaml

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: driftline:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
